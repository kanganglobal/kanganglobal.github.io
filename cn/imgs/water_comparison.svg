<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">水类型对比</text>
  
  <!-- Water Types -->
  <g transform="translate(50, 100)">
    <!-- Tap Water -->
    <g transform="translate(0, 0)">
      <circle cx="30" cy="30" r="30" fill="#d4f1f9" stroke="#75c6ef" stroke-width="2"/>
      <text x="30" y="35" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">自来水</text>
      <text x="100" y="20" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• 经过处理的市政供水</text>
      <text x="100" y="40" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• 含氯和矿物质</text>
    </g>
    
    <!-- Purified Water -->
    <g transform="translate(0, 80)">
      <circle cx="30" cy="30" r="30" fill="#e6f7ff" stroke="#91d5ff" stroke-width="2"/>
      <text x="30" y="35" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">纯净水</text>
      <text x="100" y="20" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• 几乎不含矿物质</text>
      <text x="100" y="40" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• 通过蒸馏或反渗透制备</text>
    </g>
    
    <!-- Mineral Water -->
    <g transform="translate(0, 160)">
      <circle cx="30" cy="30" r="30" fill="#d9f7be" stroke="#95de64" stroke-width="2"/>
      <text x="30" y="35" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">矿泉水</text>
      <text x="100" y="20" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• 富含天然矿物质</text>
      <text x="100" y="40" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• 来自地下水源</text>
    </g>
  </g>
  
  <g transform="translate(400, 100)">
    <!-- Acidic Water -->
    <g transform="translate(0, 0)">
      <circle cx="30" cy="30" r="30" fill="#fff2e8" stroke="#ffbb96" stroke-width="2"/>
      <text x="30" y="35" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">酸性水</text>
      <text x="100" y="20" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• pH值低于7</text>
      <text x="100" y="40" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• 用于消毒和清洁</text>
    </g>
    
    <!-- Alkaline Water -->
    <g transform="translate(0, 80)">
      <circle cx="30" cy="30" r="30" fill="#f0f5ff" stroke="#adc6ff" stroke-width="2"/>
      <text x="30" y="35" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">碱性水</text>
      <text x="100" y="20" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• pH值高于7</text>
      <text x="100" y="40" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• 用于饮用和烹饪</text>
    </g>
    
    <!-- Hydrogen-Rich Water -->
    <g transform="translate(0, 160)">
      <circle cx="30" cy="30" r="30" fill="#e6fffb" stroke="#87e8de" stroke-width="2"/>
      <text x="30" y="35" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">富氢水</text>
      <text x="100" y="20" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• 含有溶解分子氢</text>
      <text x="100" y="40" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• 具有抗氧化特性</text>
    </g>
    
    <!-- Beauty Water -->
    <g transform="translate(0, 240)">
      <circle cx="30" cy="30" r="30" fill="#fff0f6" stroke="#ffadd2" stroke-width="2"/>
      <text x="30" y="35" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">美容水</text>
      <text x="100" y="20" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• 弱酸性水</text>
      <text x="100" y="40" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• 用于皮肤护理</text>
    </g>
  </g>
  
  <!-- Footer -->
  <text x="400" y="480" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">不同类型的水适用于不同的用途，Kangan Water系统可以生成多种功能水</text>
</svg>