<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Cell Membrane -->
  <ellipse cx="300" cy="200" rx="250" ry="150" fill="#f0f8ff" stroke="#99ccff" stroke-width="3" stroke-dasharray="5,5"/>
  
  <!-- Free Radical -->
  <g transform="translate(150, 150)">
    <circle cx="0" cy="0" r="30" fill="#ffcccc" stroke="#ff6666" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="#cc0000">·OH</text>
    <text x="0" y="-40" font-family="Arial" font-size="14" text-anchor="middle" fill="#cc0000">Free Radical</text>
  </g>
  
  <!-- Antioxidant -->
  <g transform="translate(400, 180)">
    <circle cx="0" cy="0" r="35" fill="#ccffcc" stroke="#66cc66" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="#006600">H₂</text>
    <text x="0" y="-50" font-family="Arial" font-size="14" text-anchor="middle" fill="#006600">Antioxidant</text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(250, 165)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="50" y="-10" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Neutralize</text>
  </g>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Result -->
  <g transform="translate(500, 150)">
    <circle cx="0" cy="0" r="30" fill="#e6e6e6" stroke="#999999" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">H₂O</text>
    <text x="0" y="-40" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Harmless Substance</text>
  </g>
  
  <!-- Title -->
  <text x="300" y="50" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Antioxidant Mechanism</text>
</svg>