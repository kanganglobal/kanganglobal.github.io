<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Water Ripple Pattern -->
  <defs>
    <pattern id="water-pattern" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Ripple 1 -->
      <path d="M0,100 C40,80 60,120 100,100 C140,80 160,120 200,100 C240,80 260,120 300,100 C340,80 360,120 400,100" 
            fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" />
      
      <!-- Ripple 2 (Offset) -->
      <path d="M0,150 C40,130 60,170 100,150 C140,130 160,170 200,150 C240,130 260,170 300,150 C340,130 360,170 400,150" 
            fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" />
      
      <!-- Ripple 3 (Offset) -->
      <path d="M0,50 C40,30 60,70 100,50 C140,30 160,70 200,50 C240,30 260,70 300,50 C340,30 360,70 400,50" 
            fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" />
      
      <!-- Water Molecule Pattern -->
      <g transform="translate(50, 50)" opacity="0.2">
        <circle cx="0" cy="0" r="5" fill="#ffffff" />
        <circle cx="-8" cy="-8" r="3" fill="#ffffff" />
        <circle cx="8" cy="-8" r="3" fill="#ffffff" />
      </g>
      
      <g transform="translate(150, 100)" opacity="0.2">
        <circle cx="0" cy="0" r="5" fill="#ffffff" />
        <circle cx="-8" cy="-8" r="3" fill="#ffffff" />
        <circle cx="8" cy="-8" r="3" fill="#ffffff" />
      </g>
    </pattern>
  </defs>
  
  <!-- Background Rectangle -->
  <rect width="1200" height="800" fill="url(#water-pattern)" />
</svg>