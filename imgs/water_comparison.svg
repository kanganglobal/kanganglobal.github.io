<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Water Type Comparison</text>
  
  <!-- Water Types -->
  <g transform="translate(50, 100)">
    <!-- Tap Water -->
    <g transform="translate(0, 0)">
      <circle cx="30" cy="30" r="30" fill="#d4f1f9" stroke="#75c6ef" stroke-width="2"/>
      <text x="30" y="35" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Tap Water</text>
      <text x="100" y="20" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• Treated municipal water supply</text>
      <text x="100" y="40" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• Contains chlorine and minerals</text>
    </g>
    
    <!-- Purified Water -->
    <g transform="translate(0, 80)">
      <circle cx="30" cy="30" r="30" fill="#e6f7ff" stroke="#91d5ff" stroke-width="2"/>
      <text x="30" y="35" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Purified Water</text>
      <text x="100" y="20" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• Almost no minerals</text>
      <text x="100" y="40" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• Prepared by distillation or RO</text>
    </g>
    
    <!-- Mineral Water -->
    <g transform="translate(0, 160)">
      <circle cx="30" cy="30" r="30" fill="#d9f7be" stroke="#95de64" stroke-width="2"/>
      <text x="30" y="35" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Mineral Water</text>
      <text x="100" y="20" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• Rich in natural minerals</text>
      <text x="100" y="40" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• From underground water sources</text>
    </g>
  </g>
  
  <g transform="translate(400, 100)">
    <!-- Acidic Water -->
    <g transform="translate(0, 0)">
      <circle cx="30" cy="30" r="30" fill="#fff2e8" stroke="#ffbb96" stroke-width="2"/>
      <text x="30" y="35" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Acidic Water</text>
      <text x="100" y="20" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• pH value below 7</text>
      <text x="100" y="40" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• Used for disinfection and cleaning</text>
    </g>
    
    <!-- Alkaline Water -->
    <g transform="translate(0, 80)">
      <circle cx="30" cy="30" r="30" fill="#f0f5ff" stroke="#adc6ff" stroke-width="2"/>
      <text x="30" y="35" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Alkaline Water</text>
      <text x="100" y="20" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• pH value above 7</text>
      <text x="100" y="40" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• Used for drinking and cooking</text>
    </g>
    
    <!-- Hydrogen-Rich Water -->
    <g transform="translate(0, 160)">
      <circle cx="30" cy="30" r="30" fill="#e6fffb" stroke="#87e8de" stroke-width="2"/>
      <text x="30" y="35" font-family="Arial" font-size="11" text-anchor="middle" fill="#333">Hydrogen Water</text>
      <text x="100" y="20" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• Contains dissolved molecular hydrogen</text>
      <text x="100" y="40" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• Has antioxidant properties</text>
    </g>
    
    <!-- Beauty Water -->
    <g transform="translate(0, 240)">
      <circle cx="30" cy="30" r="30" fill="#fff0f6" stroke="#ffadd2" stroke-width="2"/>
      <text x="30" y="35" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Beauty Water</text>
      <text x="100" y="20" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• Slightly acidic water</text>
      <text x="100" y="40" font-family="Arial" font-size="12" text-anchor="start" fill="#333">• Used for skin care</text>
    </g>
  </g>
  
  <!-- Footer -->
  <text x="400" y="480" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">Different types of water are suitable for different uses, Kangan Water systems can generate various functional waters</text>
</svg>