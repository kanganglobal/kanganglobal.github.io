<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Hydrogen Molecule (H2) -->
  <circle cx="150" cy="150" r="50" fill="#e6f7ff" stroke="#0099ff" stroke-width="2"/>
  <circle cx="250" cy="150" r="50" fill="#e6f7ff" stroke="#0099ff" stroke-width="2"/>
  
  <!-- Bond -->
  <line x1="200" y1="150" x2="200" y2="150" stroke="#0066cc" stroke-width="8"/>
  
  <!-- Labels -->
  <text x="150" y="155" font-family="Arial" font-size="24" text-anchor="middle" fill="#0066cc">H</text>
  <text x="250" y="155" font-family="Arial" font-size="24" text-anchor="middle" fill="#0066cc">H</text>
  <text x="200" y="230" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">Molecular Hydrogen (H₂)</text>
</svg>